name: Check static cards

on:
  push:
    paths:
      - 'assets/js/roles-data.js'
      - 'assets/js/posts.js'
      - 'scripts/build-static-cards.cjs'
      - 'index.html'
      - 'blog.html'
      - 'arbeitsproben.html'
      - '.github/workflows/check-static-cards.yml'
  pull_request:
    paths:
      - 'assets/js/roles-data.js'
      - 'assets/js/posts.js'
      - 'scripts/build-static-cards.cjs'
      - 'index.html'
      - 'blog.html'
      - 'arbeitsproben.html'
      - '.github/workflows/check-static-cards.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-static-cards.cjs --check
